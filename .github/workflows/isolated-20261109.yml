name: Hermes isolated compatibility rehearsal
on:
  push:
    branches: [rehearsal/2026-11-09-hermes-0.23.0]
    paths: [.github/workflows/isolated-20261109.yml]
permissions:
  contents: read
  packages: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Test migration, profile routing and custom GUI
        shell: bash
        env:
          REHEARSAL_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          df -h .
          mkdir -p image/docker state fixtures/defold fixtures/obsidian fixtures/host-data fixtures/rosemary
          cat > image/docker/agent-gui-session.sh <<'EOF'
          #!/bin/sh
          # Start or reuse the agent-owned virtual GUI session, then optionally run a command.
          # Intended for non-interactive agent smokes: Xvfb + openbox + xdotool/import.
          set -eu
          
          DISPLAY_VALUE="${DISPLAY:-${HERMES_AGENT_GUI_DISPLAY:-:99}}"
          SCREEN_GEOMETRY="${HERMES_AGENT_GUI_SCREEN:-1280x720x24}"
          XVFB_LOG="${HERMES_AGENT_GUI_XVFB_LOG:-/tmp/hermes-agent-xvfb.log}"
          OPENBOX_LOG="${HERMES_AGENT_GUI_OPENBOX_LOG:-/tmp/hermes-agent-openbox.log}"
          
          export DISPLAY="$DISPLAY_VALUE"
          export LIBGL_ALWAYS_SOFTWARE="${LIBGL_ALWAYS_SOFTWARE:-1}"
          export ALSOFT_DRIVERS="${ALSOFT_DRIVERS:-null}"
          export NO_AT_BRIDGE="${NO_AT_BRIDGE:-1}"
          
          # Xvfb uses a lock file named /tmp/.X<N>-lock where DISPLAY is :<N>.
          display_number=$(printf '%s' "$DISPLAY_VALUE" | sed 's/^://; s/\..*$//')
          lock_file="/tmp/.X${display_number}-lock"
          
          if [ ! -S "/tmp/.X11-unix/X${display_number}" ] && [ ! -f "$lock_file" ]; then
              Xvfb "$DISPLAY_VALUE" -screen 0 "$SCREEN_GEOMETRY" -nolisten tcp >"$XVFB_LOG" 2>&1 &
              # Give the socket a short bounded window to appear.
              i=0
              while [ "$i" -lt 50 ]; do
                  [ -S "/tmp/.X11-unix/X${display_number}" ] && break
                  i=$((i + 1))
                  sleep 0.1
              done
          fi
          
          if command -v openbox >/dev/null 2>&1; then
              if ! DISPLAY="$DISPLAY_VALUE" wmctrl -m >/dev/null 2>&1; then
                  DISPLAY="$DISPLAY_VALUE" openbox >"$OPENBOX_LOG" 2>&1 &
                  sleep 0.5
              fi
          fi
          
          if [ "$#" -eq 0 ]; then
              printf 'AGENT_GUI_SESSION: READY\n'
              printf 'DISPLAY=%s\n' "$DISPLAY"
              printf 'LIBGL_ALWAYS_SOFTWARE=%s\n' "$LIBGL_ALWAYS_SOFTWARE"
              printf 'ALSOFT_DRIVERS=%s\n' "$ALSOFT_DRIVERS"
              exit 0
          fi
          
          if [ "${1:-}" = "--" ]; then
              shift
          fi
          
          exec "$@"
          EOF
          cat > image/docker/defold-wrapper.sh <<'EOF'
          #!/bin/sh
          # Container-visible Defold Editor launcher.
          # Mount the host Defold install at /opt/defold:ro, then call `defold [project-dir]`.
          set -eu
          
          DEFOLD_HOME="${DEFOLD_HOME:-/opt/defold}"
          
          if [ -x "$DEFOLD_HOME/Defold" ]; then
              cd "$DEFOLD_HOME"
              exec "$DEFOLD_HOME/Defold" "$@"
          fi
          
          if [ -x "$DEFOLD_HOME/defold" ]; then
              cd "$DEFOLD_HOME"
              exec "$DEFOLD_HOME/defold" "$@"
          fi
          
          printf 'defold wrapper: no executable found at %s/Defold or %s/defold\n' "$DEFOLD_HOME" "$DEFOLD_HOME" >&2
          printf 'Mount the host Defold install into the container, e.g. /opt/defold:/opt/defold:ro\n' >&2
          exit 127
          EOF
          cat > image/Dockerfile <<'EOF'
          FROM docker.io/nousresearch/hermes-agent@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
          USER root
          # MonacledMonkey: agent-operated GUI stack for Defold, Krita and Pixelorama.
          # Separate from upstream's opt-in Bot Screen. Installs GUI applications only
          # on this fork's image; preserves upstream's pinned Chromium and PM toolchain.
          # Disk use is significant; verify build space before deploying.
          RUN apt-get -o Acquire::Retries=3 update && \
              DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
              xvfb openbox dbus-x11 xdotool x11-utils wmctrl imagemagick krita \
              fonts-dejavu-core fonts-liberation fonts-noto-color-emoji \
              libgtk-3-0t64 libopenal1 libsdl2-2.0-0 libgl1 libglx-mesa0 \
              libglu1-mesa libxss1 libsecret-1-0 libnotify4 libxtst6 \
              libxrender1 libxi6 libxinerama1 libxcursor1 libfuse2t64 fuse3 && \
              rm -rf /var/lib/apt/lists/*
          
          ENV HERMES_AGENT_GUI_DISPLAY=:99
          ENV HERMES_AGENT_GUI_SCREEN=1280x720x24
          ENV DISPLAY=:99
          ENV LIBGL_ALWAYS_SOFTWARE=1
          ENV ALSOFT_DRIVERS=null
          ENV NO_AT_BRIDGE=1
          COPY --chmod=0755 docker/agent-gui-session.sh /usr/local/bin/agent-gui-session
          COPY --chmod=0755 docker/defold-wrapper.sh /usr/local/bin/defold
          EOF
          docker build --platform linux/amd64 -t hermes-20261109-rehearsal image
          docker image inspect hermes-20261109-rehearsal --format 'candidate={{.Id}} arch={{.Architecture}}'
          cat > seed.py <<'PY'
          from pathlib import Path
          from hermes_state import SessionDB
          import sqlite3

          root = Path('/fixture')
          for name in ('default','asset','builder','devteam','ops','orchestrator','qa','release','reviewer','uiux','rose-fixture','aux-fixture'):
              home = root if name == 'default' else root/'profiles'/name
              home.mkdir(parents=True, exist_ok=True)
              path = home/'state.db'
              db = SessionDB(path)
              sid = 'rehearsal-' + name
              db.create_session(sid, 'cli', model='rehearsal-fixture')
              db.append_message(sid, 'user', 'Synthetic message for ' + name)
              db.append_message(sid, 'assistant', 'Synthetic reply for ' + name)
              assert len(db.get_messages(sid)) == 2
              db.close()
              with sqlite3.connect(path) as sql:
                  assert sql.execute('PRAGMA quick_check(1)').fetchone()[0] == 'ok'
                  sql.execute('PRAGMA wal_checkpoint(TRUNCATE)')
              print('PASS old database fixture', name)
          PY
          old=ghcr.io/monacledmonkey/hermes-agent:nuc-upgrade-20261026@sha256:4df30f60ab6dba557dfd427e479987791f35b1b0f3f947e655e64ea6ba943d30
          if ! docker pull --platform linux/amd64 "$old"; then
            printf '%s' "$REHEARSAL_REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            docker pull --platform linux/amd64 "$old"
            docker logout ghcr.io
          fi
          sudo chown 10000:10000 state
          docker run --rm --network none --memory 512m --cpus 1 --pids-limit 96 --user 10000:10000 -e HERMES_HOME=/fixture -v "$PWD/state:/fixture" -v "$PWD/seed.py:/seed.py:ro" --entrypoint /opt/hermes/.venv/bin/python "$old" /seed.py
          docker image rm "$old"
          sudo chown -R "$(id -u):$(id -g)" state
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('default','asset','builder','devteam','ops','orchestrator','qa','release','reviewer','uiux','rose-fixture','aux-fixture'):
              home = Path('state') if name == 'default' else Path('state/profiles') / name
              key = 'rehearsal-' + name + '-synthetic-local-only-e3841a1b7ac3'
              cfg = {'gateway':{'multiplex_profiles':name=='default'},
                     'platforms':{'api_server':{'enabled':True,'extra':{'host':'127.0.0.1','port':8642,'key':key}}}}
              if name in ('default','rose-fixture'):
                  cfg['mcp_servers']={'home_assistant_fixture':{'url':'http://127.0.0.1:19311/mcp','headers':{'Authorization':'Bearer synthetic-ha-local-only'}}}
              (home / 'config.yaml').write_text(json.dumps(cfg), encoding='utf-8')
              (home / '.env').write_text(f'API_SERVER_ENABLED=true\nAPI_SERVER_KEY={key}\nAPI_SERVER_HOST=127.0.0.1\nAPI_SERVER_PORT=8642\n', encoding='utf-8')
          PY
          printf '#!/bin/sh\nprintf "defold-fixture:%%s\\n" "$1"\n' > fixtures/defold/Defold
          printf '#!/bin/sh\necho pixelorama-fixture\n' > fixtures/pixelorama
          printf '# Synthetic vault\n' > fixtures/obsidian/fixture.md
          chmod +x fixtures/defold/Defold fixtures/pixelorama
          sudo chown -R 10000:10000 state fixtures/obsidian fixtures/host-data
          cat > verify-state.py <<'PY'
          from pathlib import Path
          from hermes_state import SessionDB
          from hermes_cli.profiles import profiles_to_serve
          import sqlite3
          root = Path('/opt/data')
          for name in ('default','asset','builder','devteam','ops','orchestrator','qa','release','reviewer','uiux','rose-fixture','aux-fixture'):
              source = name
              home = root if name == 'default' else root/'profiles'/name
              db = SessionDB(home/'state.db')
              sid = 'rehearsal-' + source
              assert [m['content'] for m in db.get_messages(sid)] == ['Synthetic message for ' + source, 'Synthetic reply for ' + source]
              db.append_message(sid,'user','candidate append ' + name)
              assert db.get_messages(sid)[-1]['content'] == 'candidate append ' + name
              db.close()
              with sqlite3.connect(home/'state.db') as sql:
                  assert sql.execute('pragma integrity_check(1)').fetchone()[0] == 'ok'
              print('PASS migrated and reopened', name)
          assert {name for name, _ in profiles_to_serve(True)} == {'default','asset','builder','devteam','ops','orchestrator','qa','release','reviewer','uiux','rose-fixture','aux-fixture'}
          print('PASS multiplex profile discovery')
          PY
          docker run --rm --network none --memory 1g --cpus 1 --pids-limit 128 --user 10000:10000 -e HERMES_HOME=/opt/data -v "$PWD/state:/opt/data" -v "$PWD/verify-state.py:/test.py:ro" --entrypoint /opt/hermes/.venv/bin/python hermes-20261109-rehearsal /test.py
          docker run --rm --network none --memory 2g --cpus 2 --pids-limit 160 --user 10000:10000 --entrypoint /bin/sh \
            -v "$PWD/fixtures/defold:/opt/defold:ro" \
            -v "$PWD/fixtures/pixelorama:/usr/local/bin/pixelorama:ro" \
            -v "$PWD/fixtures/obsidian:/opt/obsidian/hermes-dev-team-vault" \
            -v "$PWD/fixtures/host-data:/opt/host-data" \
            hermes-20261109-rehearsal -ec '
              test "$(defold demo-project)" = defold-fixture:demo-project
              test "$(pixelorama)" = pixelorama-fixture
              test -r /opt/obsidian/hermes-dev-team-vault/fixture.md
              printf "%s\n" synthetic > /opt/obsidian/hermes-dev-team-vault/rehearsal.md
              printf "%s\n" synthetic > /opt/host-data/rehearsal.txt
              timeout 30 agent-gui-session -- sh -ec "xdpyinfo >/dev/null; wmctrl -m; krita --version; import -window root /tmp/rehearsal.png; test -s /tmp/rehearsal.png"
              echo "PASS GUI/Xvfb/Openbox/Krita and synthetic Defold/Pixelorama/Obsidian mount contracts"
            '
          docker run -d --name hermes-rehearsal --network none --memory 4g --cpus 2 --pids-limit 512 \
            -e HERMES_DASHBOARD=true -e HERMES_DASHBOARD_HOST=127.0.0.1 -e HERMES_DASHBOARD_PORT=9119 \
            -e HERMES_HOME=/opt/data -v "$PWD/state:/opt/data" hermes-20261109-rehearsal gateway run >/dev/null
          trap 'docker logs --tail 120 hermes-rehearsal 2>&1 || true; docker rm -f hermes-rehearsal >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 60); do
            if docker exec hermes-rehearsal curl -fsS --max-time 2 http://127.0.0.1:9119/ >/dev/null 2>&1; then break; fi
            test "$(docker inspect --format '{{.State.Running}}' hermes-rehearsal)" = true
            sleep 2
          done
          docker exec hermes-rehearsal curl -fsS --max-time 5 http://127.0.0.1:9119/ -o /dev/null
          echo 'PASS supervised dashboard'
          docker exec -i hermes-rehearsal /opt/hermes/.venv/bin/python - <<'PY'
          import json, time, urllib.request, urllib.error
          from hermes_cli.gateway_multiplex_served import recorded_served_profiles
          expected = {'default','asset','builder','devteam','ops','orchestrator','qa','release','reviewer','uiux','rose-fixture','aux-fixture'}
          for _ in range(30):
              if set(recorded_served_profiles() or []) == expected:
                  break
              time.sleep(2)
          else:
              raise RuntimeError('gateway did not serve all rehearsal profiles')
          for name in sorted(expected):
              path = '/v1/models' if name == 'default' else f'/p/{name}/v1/models'
              url = 'http://127.0.0.1:8642' + path
              key = 'rehearsal-' + name + '-synthetic-local-only-e3841a1b7ac3'
              req = urllib.request.Request(url, headers={'Authorization':'Bearer '+key})
              with urllib.request.urlopen(req, timeout=5) as response:
                  assert response.status == 200 and 'data' in json.load(response)
              try:
                  urllib.request.urlopen(urllib.request.Request(url, headers={'Authorization':'Bearer rehearsal-wrong-synthetic-key'}),timeout=5)
              except urllib.error.HTTPError as err:
                  assert err.code in (401,403), err.code
              else:
                  raise AssertionError('incorrect credential accepted')
              print('PASS isolated profile route and wrong-key rejection',name)
          PY
          cat > fixture-mcp.py <<'PY'
          from mcp.server.fastmcp import FastMCP
          server = FastMCP('synthetic-home-assistant', host='127.0.0.1', port=19311, stateless_http=True, json_response=True)

          @server.tool()
          def get_entity_state(entity_id: str) -> str:
              """Return only synthetic read-only state."""
              assert entity_id == 'sensor.rehearsal_fixture'
              return 'REHEARSAL_ENTITY_STATE'
          server.run(transport='streamable-http')
          PY
          docker cp fixture-mcp.py hermes-rehearsal:/tmp/fixture-mcp.py
          docker exec -d -u 10000:10000 hermes-rehearsal /opt/hermes/.venv/bin/python /tmp/fixture-mcp.py
          for i in $(seq 1 24); do
            code=$(docker exec hermes-rehearsal curl -s --max-time 2 -o /dev/null -w '%{http_code}' http://127.0.0.1:19311/mcp || true)
            if [ "$code" != 000 ]; then break; fi
            sleep 1
          done
          test "$code" != 000
          for home in /opt/data /opt/data/profiles/rose-fixture; do
            docker exec -i -u 10000:10000 -e HERMES_HOME="$home" hermes-rehearsal /opt/hermes/.venv/bin/python - <<'PY'
          from tools.mcp_tool_discovery import discover_mcp_tools
          from tools.registry import registry
          names = discover_mcp_tools(['home_assistant_fixture'])
          matches = [name for name in names if name.endswith('get_entity_state')]
          assert len(matches) == 1, names
          result = registry.dispatch(matches[0], {'entity_id':'sensor.rehearsal_fixture'})
          assert 'REHEARSAL_ENTITY_STATE' in str(result), result
          print('PASS synthetic Home Assistant MCP discovery and read-only tool call')
          PY
          done
          docker exec -u 10000:10000 hermes-rehearsal /opt/hermes/.venv/bin/hermes --profile rose-fixture config --help >/dev/null
          echo 'PASS Rosemary profile selector CLI compatibility'
          docker inspect --format 'memory={{.HostConfig.Memory}} oom={{.State.OOMKilled}} network={{.HostConfig.NetworkMode}}' hermes-rehearsal
