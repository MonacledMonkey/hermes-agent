name: Build NUC Hermes upgrade image

on:
  push:
    branches:
      - upgrade-upstream-20261026
    paths:
      - Dockerfile
      - docker/**
      - docker-compose.yml
      - .github/workflows/nuc-hermes-upgrade.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: nuc-hermes-upgrade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'MonacledMonkey/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@v4

      - name: Show build disk capacity
        run: df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated test image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/monacledmonkey/hermes-agent:nuc-upgrade-20261026
            ghcr.io/monacledmonkey/hermes-agent:nuc-upgrade-${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Print published image tag
        run: echo "Published ghcr.io/monacledmonkey/hermes-agent:nuc-upgrade-${{ github.sha }}"
